.0,216.0L915.0,225.0L907.5,225.0Z" fill="#ffffff" stroke="#999" stroke-width=".6"/><path d="M901.5,310.5L946.5,310.5L946.5,288.0L901.5,288.0Z" fill="#1d1d1d" /><path d="M720,180L720,457.5" stroke="#222" stroke-dasharray="10 4 2 4" stroke-width="1"/><path d="M357,201L622.5,222.75" stroke="#222" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="351" y="206" font-size="14" fill="#222" text-anchor="end" >dish 1.2 deep, Ø25 (fingertip)</text><path d="M357,237L682.5,253.5" stroke="#222" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="351" y="242" font-size="14" fill="#222" text-anchor="end" >printed pin Ø7.95 × 10.4</text><path d="M357,264.75L645,269.25" stroke="#222" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="351" y="269.75" font-size="14" fill="#222" text-anchor="end" >boss Ø12 bears on the inner ring only</text><path d="M357,297L585,266.25" stroke="#222" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="351" y="302" font-size="14" fill="#222" text-anchor="end" >0.5 relief ring clears the outer ring</text><path d="M357,327L528,274.5" stroke="#222" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="351" y="332" font-size="14" fill="#222" text-anchor="end" >hub stepped down 0.6 under the rim</text><path d="M357,357L667.5,387" stroke="#222" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="351" y="362" font-size="14" fill="#222" text-anchor="end" >socket Ø8.1, 3 crush ribs, 1.8 deep</text><path d="M357,414L555,426" stroke="#222" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="351" y="419" font-size="14" fill="#222" text-anchor="end" >same cap, flipped, on the bottom</text><path d="M1083,192L918,219" stroke="#222" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="1089" y="197" font-size="14" fill="#222"  >white pointer on the rim</text><path d="M1083,234L922.5,256.5" stroke="#222" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="1089" y="239" font-size="14" fill="#222"  >magnet 3 × 1.5, moved in to r 12.3</text><text x="1089" y="257" font-size="13" fill="#5d5d5d"  >(today it hangs 1.2 past the cap edge)</text><path d="M1083,297L937.5,301.5" stroke="#222" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="1089" y="302" font-size="14" fill="#222"  >hall sensor (unchanged)</text><path d="M1083,396L904.5,387" stroke="#222" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="1089" y="401" font-size="14" fill="#222"  >empty magnet pocket</text><path d="M930,456L510,456" stroke="#222" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="720" y="476" font-size="14" fill="#222" text-anchor="middle" >Ø28 (same as today)</text><text x="620" y="650" font-size="18" fill="#222"  font-weight="600">3  Top view of one cap</text><circle cx="760" cy="810" r="84" fill="#7d1b22"/><defs><radialGradient id="dish"><stop offset="0" stop-color="#5a1218"/><stop offset="1" stop-color="#7d1b22"/></radialGradient></defs><circle cx="760" cy="810" r="75" fill="url(#dish)" stroke="#a8444b" stroke-width="1"/><path d="M760,727.8L746.8,737L773.2,737Z" fill="#ffffff"/><circle cx="760" cy="736.2" r="9.51" fill="none" stroke="#e0c3c5" stroke-dasharray="4 3"/><text x="760" y="924" font-size="14" fill="#5d5d5d" text-anchor="middle" >pointer + hidden magnet at 12 o’clock</text><text x="760" y="944" font-size="14" fill="#5d5d5d" text-anchor="middle" >both caps get the pointer, so either can go on top</text><text x="40" y="650" font-size="18" fill="#222"  font-weight="600">2  As printed (no supports)</text><path d="M89.5,780L310.5,780" stroke="#222" stroke-width="2"/><text x="200" y="798" font-size="14" fill="#5d5d5d" text-anchor="middle" >bed</text><path d="M200.0,764.4L203.4,764.4L206.8,764.3L210.2,764.3L213.5,764.2L216.9,764.1L220.3,763.9L223.7,763.7L227.1,763.5L230.5,763.3L233.9,763.1L237.2,762.8L240.6,762.5L244.0,762.1L247.4,761.8L250.8,761.4L254.2,761.0L257.6,760.5L260.9,760.0L264.3,759.5L267.7,759.0L271.1,758.4L274.5,757.9L277.9,757.2L281.3,756.6L284.5,756.6L285.8,756.7L287.0,757.1L288.1,757.7L289.1,758.5L289.9,759.5L290.5,760.6L290.9,761.8L291.0,763.1L291.0,780.0L275.4,780.0L275.4,776.8L239.0,776.8L239.0,780.0L226.3,780.0L226.3,768.3L200.0,768.3L200.0,768.3L173.7,768.3L173.7,780.0L161.0,780.0L161.0,776.8L124.6,776.8L124.6,780.0L109.0,780.0L109.0,763.1L109.1,761.8L109.5,760.6L110.1,759.5L110.9,758.5L111.9,757.7L113.0,757.1L114.2,756.7L115.5,756.6L118.8,756.6L122.1,757.2L125.5,757.9L128.9,758.4L132.3,759.0L135.7,759.5L139.1,760.0L142.4,760.5L145.8,761.0L149.2,761.4L152.6,761.8L156.0,762.1L159.4,762.5L162.8,762.8L166.1,763.1L169.5,763.3L172.9,763.5L176.3,763.7L179.7,763.9L183.1,764.1L186.5,764.2L189.8,764.3L193.2,764.3L196.6,764.4L200.0,764.4Z" fill="#7d1b22" /><path d="M226,809.9L255.25,778.05" stroke="#222" stroke-width="1" fill="none" marker-end="url(#ar)"/><text x="40" y="831.9" font-size="14" fill="#222"  >cap: back down, dish up. The 0.5 relief ring is a 5.6 mm</text><text x="40" y="851.9" font-size="14" fill="#222"  >bridge over layers 1–2, like a hole from the bed.</text><path d="M418,780L522,780" stroke="#222" stroke-width="2"/><path d="M444.2,780.0L495.8,780.0L495.8,712.4L444.2,712.4Z" fill="#e6dcc3" stroke="#a8996f" stroke-width="1"/><text x="470" y="844" font-size="14" fill="#222" text-anchor="middle" >pin: standing up,</text><text x="470" y="864" font-size="14" fill="#222" text-anchor="middle" >0.4 chamfer both ends</text><text x="1060" y="650" font-size="18" fill="#222"  font-weight="600">4  What changes</text><text x="1060" y="680" font-size="14" fill="#222"  >Parts per spinner: 2 identical caps + 1 pin</text><text x="1060" y="702" font-size="14" fill="#5d5d5d"  >Gone: M2 screw, cap insert, button, glued dome</text><text x="1060" y="724" font-size="14" fill="#222"  >Assembly: push one cap on the pin, push the pin</text><text x="1060" y="746" font-size="14" fill="#222"  >through the bearing, push the second cap on.</text><text x="1060" y="768" font-size="14" fill="#222"  >Pull a cap off to take it apart.</text><text x="1060" y="798" font-size="14" fill="#222"  ><tspan font-weight="600">Trade-offs</tspan></text><text x="1060" y="820" font-size="14" fill="#5d5d5d"  >• Held by press fit only (1.8 mm grip each side).</text><text x="1060" y="842" font-size="14" fill="#5d5d5d"  >  A drop of CA makes it permanent if it loosens.</text><text x="1060" y="864" font-size="14" fill="#5d5d5d"  >• No more spinning it on a table on its dome;</text><text x="1060" y="886" font-size="14" fill="#5d5d5d"  >  it rests flat on the bottom cap’s rim.</text><text x="1060" y="908" font-size="14" fill="#5d5d5d"  >• Dish shows ~6 layer rings at 0.2 mm;</text><text x="1060" y="930" font-size="14" fill="#5d5d5d"  >  print caps at 0.1 mm for a smooth dip.</text></svg>