<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#222"/></marker></defs>
<text x="40" y="52" font-size="26" font-weight="650" fill="#222">Spin Compass: matched finger caps (sketch, not built)</text>
<text x="40" y="80" font-size="15" fill="#5d5d5d">Two identical dished caps press onto one printed pin through the 608. No screw, insert, button or glued dome.</text>
<text x="40" y="130" font-size="18" fill="#222"  font-weight="600">1  Section through the centre</text><text x="40" y="152" font-size="14" fill="#5d5d5d"  >drawn 15×; z up; the 608 and both caps stay still in your fingers, the disc spins</text><path d="M885.0,366.0L939.0,366.0L939.0,420.0L1065.0,420.0L1065.0,402.0L963.0,402.0L963.0,261.0L939.0,261.0L939.0,279.0L885.0,279.0Z" fill="#c8323a" /><path d="M963.0,261.0L1065.0,261.0L1065.0,225.0L963.0,225.0Z" fill="#c8323a" opacity=".85"/><path d="M861.0,375.0L885.0,375.0L885.0,270.0L861.0,270.0Z" fill="#a3a8ad" /><path d="M780.0,375.0L813.0,375.0L813.0,270.0L780.0,270.0Z" fill="#a3a8ad" /><path d="M813.0,371.3L861.0,371.3L861.0,368.3L813.0,368.3Z" fill="#d3d6d9" /><path d="M813.0,276.8L861.0,276.8L861.0,273.8L813.0,273.8Z" fill="#d3d6d9" /><circle cx="837" cy="322.5" r="29.25" fill="#d3d6d9" stroke="#a3a8ad" stroke-width="1.5"/><path d="M555.0,366.0L501.0,366.0L501.0,420.0L375.0,420.0L375.0,402.0L477.0,402.0L477.0,261.0L501.0,261.0L501.0,279.0L555.0,279.0Z" fill="#c8323a" /><path d="M477.0,261.0L375.0,261.0L375.0,225.0L477.0,225.0Z" fill="#c8323a" opacity=".85"/><path d="M579.0,375.0L555.0,375.0L555.0,270.0L579.0,270.0Z" fill="#a3a8ad" /><path d="M660.0,375.0L627.0,375.0L627.0,270.0L660.0,270.0Z" fill="#a3a8ad" /><path d="M627.0,371.3L579.0,371.3L579.0,368.3L627.0,368.3Z" fill="#d3d6d9" /><path d="M627.0,276.8L579.0,276.8L579.0,273.8L627.0,273.8Z" fill="#d3d6d9" /><circle cx="603" cy="322.5" r="29.25" fill="#d3d6d9" stroke="#a3a8ad" stroke-width="1.5"/><path d="M666.4,400.5L773.6,400.5L779.6,394.5L779.6,250.5L773.6,244.5L666.4,244.5L660.4,250.5L660.4,394.5Z" fill="#e6dcc3" stroke="#a8996f" stroke-width="1.2"/><path d="M720.0,234.0L727.8,234.0L735.6,233.9L743.4,233.7L751.3,233.5L759.1,233.2L766.9,232.9L774.7,232.5L782.5,232.0L790.3,231.5L798.1,230.9L805.9,230.2L813.8,229.5L821.6,228.8L829.4,227.9L837.2,227.0L845.0,226.0L852.8,225.0L860.6,223.9L868.4,222.8L876.3,221.5L884.1,220.2L891.9,218.9L899.7,217.5L907.5,216.0L915.0,21